# Deploy static site to Hostinger via rsync over SSH.
# Secrets (repo → Settings → Secrets): SSH_PRIVATE_KEY, SSH_HOST, SSH_PORT, SSH_USERNAME

name: Deploy Hostinger SSH

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="wordpress-content-export.json" \
            --exclude="AGENT-TASKS.md" \
            --exclude="WANG-MASTER-STRATEGY.md" \
            ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:domains/wang.org.pk/public_html/
